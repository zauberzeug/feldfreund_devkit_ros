version: "3.8"

services:
  devkit:
    profiles: ["devkit"] # keeps `docker compose up` from starting this alongside devkit-simulation
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: devkit_ros:latest
    network_mode: host # Required for ROS2 communication
    privileged: true # Required for hardware access
    devices:
      - /dev/ttyTHS0:/dev/ttyTHS0 # devkit serial port
      - /dev/ttyACM0:/dev/ttyACM0 # GNSS receiver (USB ACM)
      - /dev/video0:/dev/video0 # Camera main video stream
      - /dev/video1:/dev/video1 # Camera metadata stream
      - /dev/media1:/dev/media1 # Camera media controller
    volumes:
      - /dev:/dev # Access to all devices (alternative to individual mappings)
      - ~/.ros:/root/.ros # For ROS logs
      - ../:/workspace/src
    environment:
      - ROS_DOMAIN_ID=0 # Default ROS domain
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp # Using CycloneDDS

    # Source and launch the devkit system
    command: bash -c "source /opt/ros/jazzy/setup.bash && source /workspace/install/setup.bash && ros2 launch devkit_launch devkit_nocams.launch.py & tail -f /dev/null"
    restart: unless-stopped

  devkit-simulation:
    profiles: ["simulation"] # keeps `docker compose up` from starting this alongside devkit
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: devkit_ros:latest
    # network_mode: host # Only works on Linux; commented out for macOS/Windows compatibility
    privileged: true # Required for hardware access
    ports:
      - "80:80" # UI port
      - "8765:8765" # Foxglove Bridge (if enabled)
    volumes:
      - ~/.ros:/root/.ros # For ROS logs
      - ../:/workspace/src
    environment:
      - ROS_DOMAIN_ID=0 # Default ROS domain
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp # Using CycloneDDS
      - FELDFREUND_SIMULATION=true # Run in simulation mode
      # Placeholder secrets: feldfreund_devkit's Secrets() requires these even in
      # simulation (no real cameras / router are used here).
      - MJPEG_CAMERA_PASSWORD=simulation
      - TELTONIKA_PASSWORD=simulation

    # Source and launch the devkit system
    command: bash -c "source /opt/ros/jazzy/setup.bash && source /workspace/install/setup.bash && ros2 launch devkit_launch devkit_simulation.launch.py"
    restart: unless-stopped

  # Experimental ros2_control stack for the weeding screw (robot_state_publisher, controller_manager,
  # controllers) - not yet part of the `devkit` service; runs alongside it as its own service so the
  # existing hardware stack is unaffected while this is evaluated. Talks to `devkit`'s
  # WeedingScrewHandler purely over the /weeding_screw/joint_commands + /weeding_screw/joint_states
  # topics, so `network_mode: host` (shared with `devkit`) is enough - no volume/device access needed.
  devkit-control:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: devkit_ros:latest
    network_mode: host # Required for ROS2 communication with the `devkit` service
    volumes:
      - ~/.ros:/root/.ros # For ROS logs
      - ../:/workspace/src
    environment:
      - ROS_DOMAIN_ID=0 # Default ROS domain
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp # Using CycloneDDS

    # Source and launch the ros2_control stack; override y_min/y_max/z_min/z_max/max_velocity here
    # (or in a robot-specific compose override) with the real axis config instead of the generic
    # placeholder defaults.
    command: bash -c "source /opt/ros/jazzy/setup.bash && source /workspace/install/setup.bash && ros2 launch devkit_launch devkit_control.launch.py"
    restart: unless-stopped
